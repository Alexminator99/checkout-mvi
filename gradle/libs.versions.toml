[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
androidxHilt = "1.4.0"
coroutines = "1.11.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
androidxAnnotation = "1.11.0"
javaxInject = "1"
junit = "4.13.2"
turbine = "1.2.1"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
